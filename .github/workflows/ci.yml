name: CI

# No `push` trigger on main: `deploy.yml` already calls this workflow, and a
# push that matched both put two runs in the same concurrency group, where one
# immediately cancelled the other. The gates still guard main — they run inside
# the deploy workflow, which will not publish unless they pass.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:coverage

      - name: Build (static export)
        run: npm run build:export
        env:
          GITHUB_PAGES: "true"

      - name: Bundle budget
        run: npm run check-bundle

      # Runs last: it needs both builds, and the export build above is reused.
      - name: Build (server)
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
