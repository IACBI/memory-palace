name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:coverage

      - name: Build (static export)
        run: npm run build:export
        env:
          GITHUB_PAGES: "true"

      - name: Bundle budget
        run: npm run check-bundle

      # Runs last: it needs both builds, and the export build above is reused.
      - name: Build (server)
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # TEMPORARY, with e2e/diagnose-sw.spec.ts. Chromium sizes its storage
      # quota from free disk, and a rejected `caches.open` would discard the
      # worker exactly as observed. Remove once the offline failure is understood.
      - name: Diagnose (disk)
        run: df -h /

      - name: End-to-end tests
        run: npx playwright test

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
